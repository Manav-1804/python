{% extends 'seller-header.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="zxx">

<head>
    
</head>

<body>
    
    <!-- Breadcrumb Begin -->
    <div class="breadcrumb-option">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="breadcrumb__links">
                        <a href="/"><i class="fa fa-home"></i> Home</a>
                        <a href="#">Product Details </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->

    <!-- Product Details Section Begin -->
    <section class="product-details spad">
        <div class="container">
            <div class="row">
                <div class="col-lg-6">
                    <div class="product__details__pic">
                        
                        <div class="product__details__slider__content">
                            <div class="product__details__pic__slider owl-carousel">
                                <img data-hash="product-1" class="product__big__img" src="{{product.product_image.url}}" alt="">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="product__details__text">
                        <h3>{{product.product_name}}</h3>
                        
                        <div class="product__details__price">Rs. {{product.product_price}}</div>
                        <p>{{product.product_desc}}</p>
                        <div class="product__details__button">
                            <a href="{% url 'seller-product-edit' pk=product.pk %}" class="btn btn-primary">EDIT</a>
                            <a href="{% url 'seller-product-delete' pk=product.pk %}" class="btn btn-danger">DELETE</a>
                        </div>
                    </div>
                </div>
                
            </div>
            
        </div>
    </section>
    <!-- Product Details Section End -->
</body>
</html>
{% endblock %}
