{% extends 'seller-header.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="zxx">

<head>
</head>

<body>
    <!-- Breadcrumb Begin -->
    <div class="breadcrumb-option">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="breadcrumb__links">
                        <a href="/"><i class="fa fa-home"></i> Home</a>
                        <span>Register</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->

    <!-- Contact Section Begin -->
    <section class="contact spad">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 col-md-12">
                    <div class="contact__content">
                       
                        <div class="contact__form">
                            <h5>Add Product</h5>
                            {% if msg %}
                                <b style="color: blue;">{{msg}}</b>
                            {% endif %}
                            <form action="{% url 'seller-add-product' %}" method="post" enctype="multipart/form-data">
                                {% csrf_token %}
                                <select name="product_category">
                                    <option>----Select Product Category----</option>
                                    <option value="men">men</option>
                                    <option value="women">women</option>
                                    <option value="kids">kids</option>
                                    <option value="accessories">accessories</option>
                                </select>
                                <input type="text" name="product_name" placeholder="Product Name">
                                <input type="text" name="product_price" placeholder="Product Price">
                                
                                <input type="file" name="product_image">
                                <textarea placeholder="Product Details" name="product_desc"></textarea>
                                
                                <button type="submit" class="site-btn">Add Product</button>
                            </form>
                        </div>
                    </div>
                </div>
                
        </div>
    </div>
</section>
<!-- Contact Section End -->
