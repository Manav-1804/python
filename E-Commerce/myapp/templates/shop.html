{% extends 'header.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="zxx">

<head>
</head>

<body>
    
    <!-- Breadcrumb Begin -->
    <div class="breadcrumb-option">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="breadcrumb__links">
                        <a href="./index.html"><i class="fa fa-home"></i> Home</a>
                        <span>Shop</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->

    <!-- Shop Section Begin -->
    <section class="shop spad">
        <div class="container">
            <div class="row">
                <div class="col-lg-3 col-md-3">
                    <div class="shop__sidebar">
                        <div class="sidebar__categories">
                            <div class="section-title">
                                <h4>Categories</h4>
                            </div>
                            <div class="categories__accordion">
                                <div class="accordion" id="accordionExample">
                                    <div class="card">
                                        <div>
                                            <a href="{% url 'shop' cat='all' %}">All</a>
                                        </div>
                                        
                                    </div>
                                    <div class="card">
                                        <div>
                                            <a href="{% url 'shop' cat='women' %}">Women</a>
                                        </div>
                                        
                                    </div>
                                    <div class="card">
                                        <div>
                                            <a href="{% url 'shop' cat='men' %}">Men</a>
                                        </div>
                                       
                                    </div>
                                    <div class="card">
                                        <div>
                                            <a href="{% url 'shop' cat='kids' %}">Kids</a>
                                        </div>
                                        
                                    </div>
                                    <div class="card">
                                        <div>
                                            <a href="{% url 'shop' cat='accessories' %}">Accessories</a>
                                        </div>
                                        
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                       
                    </div>
                </div>
                <div class="col-lg-9 col-md-9">
                    <div class="row">
                        {% for i in products %}
                        <div class="col-lg-4 col-md-6">
                            <div class="product__item">
                                <div class="product__item__pic set-bg" data-setbg="{{i.product_image.url}}">
                                    <div class="label new">New</div>
                                    <ul class="product__hover">
                                        <li><a href="{% url 'product-details' pk=i.pk %}">
                                <span class="arrow_expand"></span></a></li>
                                        <li><a href="#"><span class="icon_heart_alt"></span></a></li>
                                        <li><a href="#"><span class="icon_bag_alt"></span></a></li>
                                    </ul>
                                </div>
                                <div class="product__item__text">
                                    <h6><a href="#">{{i.product_name}}</a></h6>
                                    
                                    <div class="product__price">RS. {{i.product_price}}</div>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Shop Section End -->


</body>

</html>
{% endblock %}
